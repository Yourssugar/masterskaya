<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мастерская на Есенина. Ремонт и пошив сумок</title>
<meta name="description" content="Мастерская в Минске: ремонт и пошив сумок, чемоданов, хоккейных баулов, рюкзаков и ремней.">
<meta name="theme-color" content="#0e0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="cssbg" aria-hidden="true"></div>
<div id="homefx" aria-hidden="true" hidden></div>
<div class="shade" aria-hidden="true"></div>

<header id="top" class="top">
  <a class="brand" href="./">
    <span class="brand-name" data-site="name">Мастерская</span>
    <span class="brand-place" data-site="place">на Есенина</span>
  </a>
  <nav class="top-actions">
    <a class="top-phone" data-tel href="tel:+375296758793" data-site="phone">+375 29 675-87-93</a>
    <button id="replay" class="btn-ghost" type="button">Превью</button>
  </nav>
</header>

<main id="home">
  <section class="hero">
    <h1>
      <span data-site="name">Мастерская</span>
      <em data-site="place">на Есенина</em>
    </h1>
    <p class="lead">Ремонт и пошив сумок, чемоданов, хоккейных баулов, рюкзаков и ремней.</p>
    <p id="status" class="status">Сейчас открыто</p>
    <div class="actions">
      <a class="btn" data-tel href="tel:+375296758793">Позвонить</a>
      <a class="btn-ghost" data-viber href="#">Viber</a>
      <a class="btn-ghost" data-telegram href="#">Telegram</a>
    </div>
    <p class="addr"><span data-site="city">Минск</span>, <span data-site="address">ул. С. Есенина, 121, 2 этаж</span></p>
    <p class="hint">Пришлите фото поломки в Viber или Telegram, скажем цену.</p>
  </section>
</main>

<div id="intro" hidden>
  <svg id="thread" aria-hidden="true"></svg>
  <div id="props" aria-hidden="true"></div>
  <div id="phrases"></div>
  <img id="needle" alt="" aria-hidden="true">
  <div id="scissors" aria-hidden="true">
    <img id="blade-top" alt="">
    <img id="blade-bot" alt="">
  </div>
  <div class="bar"><i id="bar"></i></div>
  <button id="skip" class="btn-ghost skip" type="button">Пропустить</button>
</div>

<div id="loader" aria-hidden="true"><i></i></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
