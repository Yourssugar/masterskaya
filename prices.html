<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цены. Мастерская на Есенина</title>
<meta name="description" content="Примерные цены на ремонт и пошив сумок, чемоданов, рюкзаков, хоккейных баулов и ремней.">
<meta name="theme-color" content="#0e0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/prices.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body class="page prices-page">

<canvas id="scene" aria-hidden="true"></canvas>

<header id="top" class="top">
  <div class="top-left">
    <a class="map-mini" data-map href="https://www.google.com/maps" target="_blank" rel="noopener" aria-label="Маршрут до мастерской в Google Картах">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="11" fill="#d9cdb7"/>
        <rect x="29" y="3" width="16" height="11" rx="2.5" fill="#b4c399"/>
        <path d="M-2 31c12-5 20 5 52-6" stroke="#9db1bd" stroke-width="5.5" fill="none"/>
        <path d="M0 13h48M15 0v48M0 41l48-4M33 0l5 48" stroke="#f4ede1" stroke-width="2.4" fill="none"/>
        <path d="M24 8.5c-5.1 0-8.7 3.7-8.7 8.5 0 6.3 8.7 15 8.7 15s8.7-8.7 8.7-15c0-4.8-3.6-8.5-8.7-8.5z" fill="#b8325a" stroke="#fff" stroke-width="1.6"/>
        <circle cx="24" cy="17" r="3.1" fill="#fff"/>
      </svg>
    </a>
    <a class="brand" href="./">
      <span class="brand-name" data-site="name">Мастерская</span>
      <span class="brand-place" data-site="place">на Есенина</span>
    </a>
  </div>
  <nav class="top-actions">
    <a class="nav-btn" href="works.html"><span class="full">Было и стало</span><span class="short">Работы</span></a>
    <a class="nav-btn" href="prices.html" aria-current="page">Цены</a>
    <div class="top-contact">
      <a class="top-phone" data-tel href="tel:+375296758793" data-site="phone">+375 29 675-87-93</a>
      <span class="top-hours" data-contact-short>10:00-20:00, кроме воскресенья</span>
    </div>
  </nav>
</header>

<div class="book-ui">
  <nav class="pager" aria-label="Страницы блокнота">
    <button id="prev" class="pager-btn" type="button" aria-label="Назад">&lt;</button>
    <span id="pager-page" class="pager-page" aria-live="polite"></span>
    <button id="next" class="pager-btn" type="button" aria-label="Дальше">&gt;</button>
  </nav>
  <button id="as-text" class="btn-ghost as-text" type="button">Текстом</button>
  <p class="turn-hint">Тяните угол страницы или жмите стрелки. Колесо мыши приближает.</p>
</div>

<main id="list" class="price-list">
  <article class="sheet">
    <h1>Цены</h1>
    <div id="list-body"></div>
    <div class="actions">
      <a class="btn" data-telegram href="#">Telegram</a>
      <a class="btn-ghost" data-viber href="#">Viber</a>
      <a class="btn-ghost" data-tel href="tel:+375296758793">Позвонить</a>
    </div>
  </article>
</main>

<div id="pop" class="pop" role="dialog" aria-modal="false" aria-labelledby="pop-title" hidden>
  <p id="pop-title" class="pop-title">Сейчас мастер не на связи</p>
  <p class="pop-text">Звонить и писать можно <span data-contact>с 10:00 до 20:00, кроме воскресенья</span>. <span id="pop-next"></span></p>
  <div class="pop-actions">
    <a id="pop-go" class="btn" href="#">Всё равно написать</a>
    <button id="pop-close" class="btn-ghost" type="button">Понятно</button>
  </div>
</div>

<script type="module" src="js/prices/main.js"></script>
</body>
</html>
